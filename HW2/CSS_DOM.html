<!DOCTYPE html>
<html lang="en">
<head>
    <title>HTML DOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body> 
    <div class="container">
        <div id="main" class="card card-body">
            <h2 class="title">Items</h2>
            <ul id="items" class="list-group">
                <li class="list-group-item">Book</li>
                <li class="list-group-item">Pencil</li>
                <li class="list-group-item">Cloth</li>
                <li class="list-group-item">Desk</li>
            </ul>
        </div>
    </div>
    <script>
        let lilist = document.getElementsByClassName("list-group-item")
        for (let i = 0; i < lilist.length; i++) {
            lilist[i].style.backgroundColor = "#f4f4f4"
            lilist[i].style.fontWeight = "bold"
        }

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
